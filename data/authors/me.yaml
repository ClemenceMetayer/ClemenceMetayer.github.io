experience:
  - role: PhD student in applied mathematics in cancer science
    org: Curie Institute, INSERM, Inria, Paris, France
    supervision: Dr. Annabelle Ballesta, Dr. Anne-Laure Huber, Dr. Samuel Bernard
    start: 2022-10-01
    summary: |
      - → Development and study of model learning methods for automatically discovering EDOs systems from data
      - → Estimation of EDOs model parameters
      - → Development of a pipeline for rhythmic analysis of omics data (modeling, statistics, differential analysis, enrichment)
      - → Acquisition of knowledge about cancer, the circadian clock, the immune system, and DNA damage repair
      - → Introduction to experimental procedures (cell culture, synchronization, siRNA transfections, and cell collection)
      - → Writing scientific articles (literature review, methodology paper, application paper)
      - → Scientific monitoring

  - role: Mathematics tutor (MP, MPSI, PCSI preparatory classes)
    org: Ozanam Center, Lyon, France
