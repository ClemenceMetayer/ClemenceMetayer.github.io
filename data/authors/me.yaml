      - → Writing a research article presenting the results
      - → Scientific monitoring

  - role: Research Intern in Epidemiology
    org: Inria DRACULA, Lyon, France
    supervision: Dr. Mostafa Adimy
    start: 2020-05-01
    end: 2020-06-30
    summary: |
      - → Modeling of secondary dengue virus infection using a system of EDOs
      - → Mathematical analysis of this system (reproduction rate R0, equilibria, stability of equilibria)
      - → Acquisition of knowledge about the dengue virus and the phenomenon of antibody-dependent enhancement of infection
      - → Writing a research article presenting the results
      - → Scientific monitoring

